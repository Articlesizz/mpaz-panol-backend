# =============================================================================
# CONFIGURACIÓN DEL MICROSERVICIO SPRING BOOT - MPAZ PAÑOL
# =============================================================================
spring.application.name=mpaz-panol-backend
server.port=8080

# =============================================================================
# CONEXIÓN A SUPABASE CLOUD POSTGRESQL
# Host del proyecto: db.jvoreuzfmiaceindpcne.supabase.co
# =============================================================================
# Opción 1: Conexión directa (si tu red soporta IPv6)
spring.datasource.url=jdbc:postgresql://db.jvoreuzfmiaceindpcne.supabase.co:5432/postgres?sslmode=require

# Opción 2: Si tu conexión es IPv4, puedes usar el Session Pooler de Supabase cambiando la URL a:
# spring.datasource.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:5432/postgres?sslmode=require
# y el usuario a: postgres.jvoreuzfmiaceindpcne

spring.datasource.username=postgres
# Ingrese la contraseña de su base de datos de Supabase aquí o mediante variable de entorno DB_PASSWORD
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =============================================================================
# CONFIGURACIÓN LOGGING
# =============================================================================
logging.level.org.springframework.web=INFO
logging.level.com.mpaz.panol=DEBUG
